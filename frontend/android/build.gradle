// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// NOTA (Capacitor 8): aca vivian dos parches que ya no hacen falta.
//  1) El repo Azure Artifacts de OutSystems: @capacitor/barcode-scanner 3.x
//     dejo com.github.outsystems:osbarcode-android y ahora usa
//     io.ionic.libs:ionbarcode-android, que si esta en Maven Central.
//  2) El forzado de jvmTarget=17 en tareas Kotlin: el plugin ya declara
//     kotlin { jvmToolchain(21) }, alineado con Java 21 de Capacitor 8.
// Si vuelve el error "Inconsistent JVM-target", revisar ahi antes de reponerlos.

task clean(type: Delete) {
    delete rootProject.buildDir
}
