// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // @capacitor/barcode-scanner depende de com.github.outsystems:osbarcode-android,
        // publicado en el Azure Artifacts publico de OutSystems (no en Google/Maven
        // Central/JitPack). Debe estar a nivel raiz: las transitivas del subproyecto
        // barcode-scanner se resuelven con los repos del modulo :app.
        maven { url 'https://pkgs.dev.azure.com/OutSystemsRD/9e79bc5b-69b2-4476-9ca5-d67594972a52/_packaging/PublicArtifactRepository/maven/v1' }
    }
}

// El plugin @capacitor/barcode-scanner fija Java target 17 pero deja Kotlin en
// el default del toolchain (JDK 21 del JBR de Android Studio) -> "Inconsistent
// JVM-target". Forzamos jvmTarget=17 en toda tarea Kotlin. Match por nombre para
// no depender de importar KotlinCompile en el classpath del root buildscript.
subprojects {
    afterEvaluate { p ->
        p.tasks.matching { it.name.startsWith('compile') && it.name.endsWith('Kotlin') }.configureEach { t ->
            t.kotlinOptions { jvmTarget = '17' }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
