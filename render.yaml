services:
  # ── Servicio existente: Python (Wompi webhooks) ───────────────────────────
  - type: web
    name: sportmaps-demo
    runtime: python
    plan: starter
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # ── BFF: Entorno de Desarrollo (Develop) ──────────────────────────────────
  - type: web
    name: sportmaps-bff-dev
    runtime: node
    plan: starter
    branch: develop
    rootDir: bff
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      # Node con los parches de seguridad del 2026-10-21 (22.23.4+). Render resuelve la última 22.x.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: development
      - key: SUPABASE_URL
        value: https://luebjarufsiadojhvxgi.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://dev.sportmaps.co
      # CRONS_ENABLED=false va SOLO cuando GYM RM y Dreamers pasen a prod: el
      # autobloqueo despierta a los puentes por memoria del proceso (bridgeWsHub)
      # y los puentes siguen conectados a este BFF. Ver plan-arquitectura F0.1.
      # Puente físico GYM RM (scripts/gymrm-door-bridge/) -- valor real solo
      # en el dashboard de Render, nunca acá. Debe coincidir con
      # SPORTMAPS_BRIDGE_API_KEY en la PC del gym.
      - key: BRIDGE_API_KEY
        sync: false

  # ── BFF: Entorno de Staging (Staging) ──────────────────────────────────────
  - type: web
    name: sportmaps-bff-stg
    runtime: node
    plan: starter
    branch: staging
    rootDir: bff
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      # Node con los parches de seguridad del 2026-10-21 (22.23.4+). Render resuelve la última 22.x.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: staging
      - key: SUPABASE_URL
        value: https://luebjarufsiadojhvxgi.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://stg.sportmaps.co
      # Crons solo en prod (comparten la base). Ver docs/plan-arquitectura-robusta-2026-10.md F0.
      - key: CRONS_ENABLED
        value: "false"

  # ── BFF: Entorno de Producción (Main) ──────────────────────────────────────
  - type: web
    name: sportmaps-bff-prod
    runtime: node
    plan: starter
    branch: main
    rootDir: bff
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      # Node con los parches de seguridad del 2026-10-21 (22.23.4+). Render resuelve la última 22.x.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PLAN_CHANGE_AUTO_SCHOOL_IDS
        # Ids de escuela (coma-separados) con cambio de plan automático. Vacío = apagado.
        sync: false
      - key: SUPABASE_URL
        value: https://luebjarufsiadojhvxgi.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://app.sportmaps.co
