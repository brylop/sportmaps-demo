workflows:
  # ──────────────────────────────────────────────────────────────────────
  # ios-simulator-smoke — valida el pipeline COMPLETO (build web → Capacitor
  # → CocoaPods → compilar) SIN necesitar firma ni cuenta Apple Developer
  # activa: un build para simulador no la pide. Es el primer workflow a
  # correr, mientras se espera la activación de la cuenta y se configura
  # la integración de App Store Connect.
  #
  # ios/ YA ESTÁ VERSIONADO (bootstrap hecho: `cap add ios` SÍ corre en
  # Windows — es solo copiar archivos, lo que no corre ahí es compilar/pod
  # install). Info.plist ya trae las usage strings y GoogleService-Info.plist
  # real ya está commiteado. El `test -d ios ||` de abajo ahora resuelve a
  # true y `cap add` se saltea solo; queda `cap sync` para traer los
  # assets web nuevos en cada corrida.
  # ──────────────────────────────────────────────────────────────────────
  ios-simulator-smoke:
    name: iOS — smoke build para simulador (sin firma)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
      xcode: 26.4.1 # requisito Apple vigente desde 2026-04-28 (docs/MOBILE_ROADMAP_EXECUTION.md) — no bajar de imagen
      cocoapods: default
    scripts:
      - name: Instalar dependencias del frontend
        script: |
          cd frontend
          npm ci
      - name: Build web (Vite → build/, ver capacitor.config.ts)
        script: |
          cd frontend
          npm run build
      - name: Sync iOS (plataforma ya versionada)
        script: |
          cd frontend
          test -d ios || npx cap add ios --packagemanager CocoaPods
          npx cap sync ios
      - name: CocoaPods
        script: |
          cd frontend/ios/App
          pod install
      - name: Compilar para simulador (CODE_SIGNING_ALLOWED=NO)
        script: |
          cd frontend/ios/App
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath "$CM_BUILD_DIR/frontend/ios/build" \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - frontend/ios/build/**/*.app
      - /tmp/xcodebuild_logs/*.log

  # ──────────────────────────────────────────────────────────────────────
  # ios-testflight — el workflow real de release. Prerrequisitos YA
  # cumplidos (2026-09-03): cuenta Apple Developer activa, App ID
  # co.sportmaps.app registrado, app creada en App Store Connect
  # (APP_STORE_APPLE_ID abajo) y grupo "SportMaps Internos" creado en
  # TestFlight.
  #
  # OJO — dos intentos anteriores fallaron y quedan documentados para no
  # repetirlos:
  #   1. `environment.ios_signing` dispara el preflight AUTOMÁTICO de
  #      Codemagic (corre ANTES de cualquier script, sin lista de pasos
  #      si falla) que solo BUSCA un perfil existente y no lo crea.
  #   2. `integrations: app_store_connect: <nombre>` referencia la
  #      integración de equipo/cuenta conectada en la UI (Team/Personal
  #      settings → Integrations → Developer Portal) — según la doc
  #      oficial de Codemagic (docs.codemagic.io/yaml-code-signing/
  #      alternative-code-signing-methods), esa integración de UI es
  #      SOLO para builds configurados 100% desde la UI. Los builds
  #      manejados por codemagic.yaml (nuestro caso) fallan con
  #      `App Store Connect integration "<nombre>" does not exist` sin
  #      importar cómo se llame la key ahí — no aplica a este repo.
  # La forma correcta para codemagic.yaml es pasar las credenciales como
  # variables de entorno (grupo `appstore_ios`, creado en Codemagic ->
  # sportmaps-demo -> Settings -> Environment variables) que las
  # herramientas CLI `app-store-connect` y `keychain` leen solas:
  #   APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER,
  #   APP_STORE_CONNECT_PRIVATE_KEY (contenido completo del .p8, marcado
  #   Secure). Sin `triggering`, este workflow NO se dispara solo — solo
  #   corre si alguien lo arranca a mano en el dashboard.
  # ──────────────────────────────────────────────────────────────────────
  ios-testflight:
    name: iOS — build firmado + TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_ios # variables: APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 6808414228
        BUNDLE_ID: co.sportmaps.app
      xcode: 26.4.1
      cocoapods: default
    scripts:
      - name: Instalar dependencias del frontend
        script: |
          cd frontend
          npm ci
      - name: Build web (Vite → build/)
        script: |
          cd frontend
          npm run build
      - name: Sync iOS (plataforma ya versionada)
        script: |
          cd frontend
          test -d ios || npx cap add ios --packagemanager CocoaPods
          npx cap sync ios
      - name: CocoaPods
        script: |
          cd frontend/ios/App
          pod install
      - name: Preparar keychain para firma
        script: keychain initialize
      - name: Crear/descargar certificado y perfil de distribución (App Store Connect API)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Agregar certificado al keychain
        script: keychain add-certificates
      - name: Firma automática con los certificados
        script: |
          cd frontend
          xcode-project use-profiles
      - name: Incrementar el número de build al siguiente de App Store Connect
        script: |
          cd frontend/ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Compilar .ipa firmado
        script: |
          cd frontend/ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - SportMaps Internos
