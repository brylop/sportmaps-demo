workflows:
  # ──────────────────────────────────────────────────────────────────────
  # ios-simulator-smoke — valida el pipeline COMPLETO (build web → Capacitor
  # → CocoaPods → compilar) SIN necesitar firma ni cuenta Apple Developer
  # activa: un build para simulador no la pide. Es el primer workflow a
  # correr, mientras se espera la activación de la cuenta y se configura
  # la integración de App Store Connect.
  #
  # ios/ YA ESTÁ VERSIONADO (bootstrap hecho: `cap add ios` SÍ corre en
  # Windows — es solo copiar archivos, lo que no corre ahí es compilar/pod
  # install). Info.plist ya trae las usage strings y GoogleService-Info.plist
  # real ya está commiteado. El `test -d ios ||` de abajo ahora resuelve a
  # true y `cap add` se saltea solo; queda `cap sync` para traer los
  # assets web nuevos en cada corrida.
  # ──────────────────────────────────────────────────────────────────────
  ios-simulator-smoke:
    name: iOS — smoke build para simulador (sin firma)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
      xcode: 26.4.1 # requisito Apple vigente desde 2026-04-28 (docs/MOBILE_ROADMAP_EXECUTION.md) — no bajar de imagen
      cocoapods: default
    scripts:
      - name: Instalar dependencias del frontend
        script: |
          cd frontend
          npm ci
      - name: Build web (Vite → build/, ver capacitor.config.ts)
        script: |
          cd frontend
          npm run build
      - name: Sync iOS (plataforma ya versionada)
        script: |
          cd frontend
          test -d ios || npx cap add ios --packagemanager CocoaPods
          npx cap sync ios
      - name: CocoaPods
        script: |
          cd frontend/ios/App
          pod install
      - name: Compilar para simulador (CODE_SIGNING_ALLOWED=NO)
        script: |
          cd frontend/ios/App
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath "$CM_BUILD_DIR/frontend/ios/build" \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - frontend/ios/build/**/*.app
      - /tmp/xcodebuild_logs/*.log

  # ──────────────────────────────────────────────────────────────────────
  # ios-testflight — el workflow real de release. Prerrequisitos YA
  # cumplidos (2026-09-03): cuenta Apple Developer activa, App ID
  # co.sportmaps.app registrado, app creada en App Store Connect
  # (APP_STORE_APPLE_ID abajo), integración "codemagic" conectada en
  # Codemagic (Team settings → Integrations) y grupo "SportMaps Internos"
  # creado en TestFlight. El paso "Crear/descargar certificado y perfil de
  # distribución" es necesario porque `xcode-project use-profiles` NO crea
  # nada por sí solo — solo aplica perfiles que ya existen localmente;
  # `app-store-connect fetch-signing-files --create` es el que los genera
  # (o descarga si ya existen) vía la API antes de que Xcode los use.
  # Sin `triggering`, este workflow NO se dispara solo — solo corre si
  # alguien lo arranca a mano en el dashboard.
  #
  # OJO: NO poner `environment.ios_signing` aquí. Ese bloque activa el
  # preflight AUTOMÁTICO de Codemagic (corre ANTES que cualquier script,
  # sin lista de pasos visible si falla) que solo BUSCA un perfil
  # existente y no lo crea — chocaba con el script manual de abajo, que
  # sí crea el perfil con `--create` pero nunca llegaba a ejecutarse. El
  # control de firma es 100% manual vía los scripts de este workflow.
  # ──────────────────────────────────────────────────────────────────────
  ios-testflight:
    name: iOS — build firmado + TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 6808414228
        BUNDLE_ID: co.sportmaps.app
      xcode: 26.4.1
      cocoapods: default
    scripts:
      - name: Instalar dependencias del frontend
        script: |
          cd frontend
          npm ci
      - name: Build web (Vite → build/)
        script: |
          cd frontend
          npm run build
      - name: Sync iOS (plataforma ya versionada)
        script: |
          cd frontend
          test -d ios || npx cap add ios --packagemanager CocoaPods
          npx cap sync ios
      - name: CocoaPods
        script: |
          cd frontend/ios/App
          pod install
      - name: Crear/descargar certificado y perfil de distribución (App Store Connect API)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Firma automática con los certificados de la integración
        script: |
          cd frontend
          xcode-project use-profiles
      - name: Incrementar el número de build al siguiente de App Store Connect
        script: |
          cd frontend/ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Compilar .ipa firmado
        script: |
          cd frontend/ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - SportMaps Internos # TODO: crear este grupo en App Store Connect antes del primer run
