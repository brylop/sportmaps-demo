openapi: 3.0.3
info:
  title: SportMaps BFF API
  version: "1.0.0"
  description: >
    API REST del BFF de SportMaps (Express). Autenticación por Bearer JWT de
    Supabase (header `Authorization: Bearer <token>`). Endpoints de state-change
    sensibles exigen además el header CSRF `X-Requested-With: SportMaps`.
    Los webhooks (Wompi, MercadoPago, WhatsApp, shipping) NO usan JWT: validan
    firma/secreto propio. El endpoint interno de notificaciones valida el header
    `x-notif-secret`.
servers:
  - url: https://sportmaps-bff.onrender.com
    description: Producción
  - url: https://sportmaps-bff-dev.onrender.com
    description: Dev
  - url: http://localhost:3000
    description: Local
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de Supabase Auth del usuario logueado.
    internalSecret:
      type: apiKey
      in: header
      name: x-notif-secret
      description: Secreto compartido para el endpoint interno de despacho (pg_net → BFF).
  parameters:
    CsrfHeader:
      in: header
      name: X-Requested-With
      required: true
      description: Header anti-CSRF requerido en mutaciones sensibles.
      schema:
        type: string
        example: SportMaps
security:
  - bearerAuth: []
tags:
  - name: notifications-internal
    description: Endpoint interno de despacho (pg_net). Requiere x-notif-secret.
paths:
  /api/v1/students/children-by-ids:
    get:
      tags: [students]
      summary: Resuelve nombres/PII de menores por lote (IDs en query, legacy)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: ids
          required: true
          description: Lista de UUIDs separados por coma
          schema: { type: string, example: "uuid1,uuid2" }
      responses:
        '200': { description: Lista de menores (id, full_name, date_of_birth, avatar_url, school_id, medical_info) }
    post:
      tags: [students]
      summary: Resuelve nombres/PII de menores por lote (IDs en body)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: string, format: uuid }
            example:
              ids: ["uuid1", "uuid2"]
      responses:
        '200': { description: Lista de menores }
  /api/v1/students/bulk:
    post:
      tags: [students]
      summary: Carga masiva de deportistas (crea children, sedes, equipos, enrollments, pagos e invitaciones)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [students]
              properties:
                students:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [first_name, last_name, document_id, team, sport, parent_name, parent_email, parent_phone]
                    properties:
                      first_name: { type: string, maxLength: 100 }
                      last_name: { type: string, maxLength: 100 }
                      document_id: { type: string, maxLength: 30 }
                      grade: { type: string, maxLength: 20 }
                      medical_info: { type: string, description: "JSON con campo has_allergies (boolean)" }
                      branch: { type: string, maxLength: 100 }
                      team: { type: string, maxLength: 100 }
                      sport: { type: string, maxLength: 100 }
                      date_of_birth: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
                      gender: { type: string }
                      parent_name: { type: string }
                      parent_email: { type: string, format: email }
                      parent_phone: { type: string, pattern: '^\d{10,}$' }
                      monthly_fee: { type: number, minimum: 10000 }
                options:
                  type: object
                  properties:
                    upsert: { type: boolean, default: false }
                    defaultBranchId: { type: string, format: uuid, nullable: true }
      responses:
        '200': { description: Todos procesados sin omitidos }
        '207': { description: Procesado parcial (algunos omitidos) }
        '400': { description: Datos invalidos o document_id duplicados en el payload }
        '422': { description: Ninguno insertado/actualizado }
        '500': { description: Error de base de datos }
  /api/v1/students:
    get:
      tags: [students]
      summary: Lista deportistas de la escuela
      security:
        - bearerAuth: []
      responses:
        '200': { description: "{ students: [...] }" }
        '500': { description: Error }
  /api/v1/students/{id}:
    put:
      tags: [students]
      summary: Actualiza perfil base + enrollment de un atleta (child/adult/unregistered)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [athlete_type]
              properties:
                athlete_type: { type: string, enum: [child, adult, unregistered] }
                profile:
                  type: object
                  properties:
                    full_name: { type: string }
                    date_of_birth: { type: string }
                    medical_info: { type: string }
                    tshirt_size: { type: string }
                    blood_type: { type: string }
                    eps_name: { type: string }
                    parent_email: { type: string }
                    parent_phone: { type: string }
                enrollment:
                  type: object
                  properties:
                    team_id: { type: string, format: uuid, nullable: true }
                    team_start_date: { type: string }
                    team_monthly_fee: { type: number, nullable: true }
                    offering_plan_id: { type: string, format: uuid, nullable: true }
                    plan_start_date: { type: string }
                    plan_monthly_fee: { type: number, nullable: true }
      responses:
        '200': { description: "{ success: true }" }
        '400': { description: Faltan parametros o athlete_type invalido }
        '403': { description: Acceso denegado (ownership) }
        '500': { description: Error }
  /api/v1/students/create-one:
    post:
      tags: [students]
      summary: Alta de un atleta (child, adult_existing, child_existing, adult_invite, unregistered_adult)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              description: Union discriminada por `type`. Campos base de enrollment aplican salvo adult_invite.
              properties:
                type: { type: string, enum: [child, adult_existing, child_existing, adult_invite, unregistered_adult] }
                branch_id: { type: string, format: uuid, nullable: true }
                team_id: { type: string, format: uuid, nullable: true }
                offering_plan_id: { type: string, format: uuid, nullable: true }
                offering_id: { type: string, format: uuid, nullable: true }
                start_date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
                monthly_fee: { type: number, minimum: 10000, nullable: true }
                discount_pct: { type: number, minimum: 0, maximum: 100 }
                doc_type: { type: string, enum: [TI, CC, CE, PP] }
                doc_number: { type: string }
                full_name: { type: string, maxLength: 150 }
                date_of_birth: { type: string, nullable: true }
                gender: { type: string, nullable: true }
                grade: { type: string, nullable: true }
                medical_info: { type: string }
                parent_name: { type: string }
                parent_email: { type: string, format: email }
                parent_phone: { type: string, pattern: '^\d{10,}$' }
                user_id: { type: string, format: uuid }
                child_id: { type: string, format: uuid }
                email: { type: string, format: email }
                phone: { type: string, nullable: true }
                send_invite: { type: boolean, default: false }
      responses:
        '201': { description: Creado }
        '400': { description: Datos invalidos }
        '404': { description: Perfil o menor no encontrado }
        '409': { description: Duplicado }
        '500': { description: Error }
  /api/v1/enrollments:
    post:
      tags: [enrollments]
      summary: Crea inscripcion (equipo, plan o ambos)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: string, format: uuid }
                child_id: { type: string, format: uuid }
                unregistered_athlete_id: { type: string, format: uuid }
                team_id: { type: string, format: uuid }
                offering_plan_id: { type: string, format: uuid }
                status: { type: string, enum: [active, cancelled, pending], default: active }
                start_date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
                end_date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      responses:
        '201': { description: Inscripcion creada }
        '400': { description: Datos invalidos o ya inscrito }
        '404': { description: Deportista no encontrado }
        '500': { description: Error }
    get:
      tags: [enrollments]
      summary: Lista inscripciones de la escuela
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: team_id, schema: { type: string, format: uuid } }
        - { in: query, name: offering_plan_id, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string } }
      responses:
        '200': { description: "{ enrollments: [...] }" }
        '500': { description: Error }
  /api/v1/enrollments/my-plan:
    get:
      tags: [enrollments]
      summary: Plan(es) activo(s) del atleta autenticado (o de un hijo)
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: child_id, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
        '500': { description: Error }
  /api/v1/enrollments/assign-plan:
    post:
      tags: [enrollments]
      summary: Asigna un plan a una inscripcion existente
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollment_id, offering_plan_id]
              properties:
                enrollment_id: { type: string, format: uuid }
                offering_plan_id: { type: string, format: uuid }
      responses:
        '200': { description: "{ enrollment }" }
        '404': { description: Plan no encontrado }
        '500': { description: Error }
  /api/v1/enrollments/{id}:
    patch:
      tags: [enrollments]
      summary: Actualiza estado / fecha fin / plan de una inscripcion
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string }
                end_date: { type: string }
                offering_plan_id: { type: string, format: uuid }
      responses:
        '200': { description: Inscripcion actualizada }
        '404': { description: No encontrada }
        '500': { description: Error }
    delete:
      tags: [enrollments]
      summary: Cancela (soft-delete) una inscripcion
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Inscripcion desactivada }
        '404': { description: No encontrada }
        '500': { description: Error }
  /api/v1/reports/school/summary:
    get:
      tags: [reports]
      summary: Resumen de escuela (ocupacion, crecimiento, ingresos)
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: branch_id, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
        '500': { description: Error }
  /api/v1/reports/reporter/dashboard:
    get:
      tags: [reports]
      summary: Dashboard del reporter
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: branch_id, schema: { type: string, format: uuid } }
        - { in: query, name: days, schema: { type: integer, default: 30 } }
      responses:
        '200': { description: OK }
        '500': { description: Error }
  /api/v1/reports/coach/{teamId}:
    get:
      tags: [reports]
      summary: Reporte de un equipo (roster, resultados, asistencia)
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: teamId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
        '403': { description: Sin permiso }
        '404': { description: Equipo no encontrado }
        '500': { description: Error }
  /api/v1/reports/school/documents:
    get:
      tags: [reports]
      summary: Estudiantes + rutas de documentos de identidad
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: branch_id, schema: { type: string, format: uuid } }
        - { in: query, name: team_id, schema: { type: string, format: uuid } }
        - { in: query, name: offering_plan_id, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
        '500': { description: Error }
  /api/v1/attendance/session/{teamId}:
    get:
      tags: [attendance]
      summary: Sesion de hoy del equipo + registros
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: teamId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
        '500': { description: Error }
  /api/v1/attendance/roster/{contextType}/{contextId}:
    get:
      tags: [attendance]
      summary: Roster de atletas + bookings del dia por equipo u offering
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: contextType, required: true, schema: { type: string, enum: [team, offering] } }
        - { in: path, name: contextId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
        '400': { description: contextType invalido }
        '500': { description: Error }
  /api/v1/attendance/session:
    post:
      tags: [attendance]
      summary: Guarda registros de asistencia (child/user/unregistered)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                teamId: { type: string, format: uuid }
                sessionId: { type: string, format: uuid }
                records:
                  type: array
                  items:
                    type: object
                    required: [status]
                    properties:
                      childId: { type: string, format: uuid }
                      userId: { type: string, format: uuid }
                      unregisteredAthleteId: { type: string, format: uuid }
                      status: { type: string }
      responses:
        '200': { description: OK }
        '400': { description: Faltan teamId/sessionId o records }
        '409': { description: Sesion finalizada }
        '500': { description: Error }
  /api/v1/attendance/walk-in:
    post:
      tags: [attendance]
      summary: Valida plan, registra asistencia y descuenta credito
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollmentId]
              properties:
                enrollmentId: { type: string, format: uuid }
                teamId: { type: string, format: uuid }
                sessionId: { type: string, format: uuid }
                offeringId: { type: string, format: uuid }
                status: { type: string, default: present }
                childId: { type: string, format: uuid }
                userId: { type: string, format: uuid }
                unregisteredAthleteId: { type: string, format: uuid }
                is_secondary: { type: boolean, default: false }
      responses:
        '201': { description: OK }
        '400': { description: Faltan parametros }
        '404': { description: Sesion no encontrada }
        '409': { description: Sesion finalizada }
        '422': { description: Plan vencido / sin creditos / no encontrado }
        '500': { description: Error }
  /api/v1/attendance/session/{sessionId}/finalize:
    patch:
      tags: [attendance]
      summary: Finaliza la sesion (irreversible)
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
        '404': { description: Sesion no encontrada }
        '409': { description: Ya finalizada }
        '500': { description: Error }
  /api/v1/attendance/rate/{teamId}:
    get:
      tags: [attendance]
      summary: Porcentaje de asistencia del equipo
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: teamId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
        '500': { description: Error }
  /api/v1/attendance/link-unregistered:
    post:
      tags: [attendance]
      summary: Enlaza un atleta no registrado a un perfil registrado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unregisteredAthleteId]
              properties:
                unregisteredAthleteId: { type: string, format: uuid }
                targetUserId: { type: string, format: uuid }
                targetChildId: { type: string, format: uuid }
      responses:
        '200': { description: OK }
        '400': { description: Faltan parametros }
        '403': { description: Sin permisos }
        '500': { description: Error }
  /api/v1/school/context:
    get:
      tags: [school-context]
      summary: Capacidades y modulos activos de la escuela
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '500': { description: Error }
  /api/v1/school/context/modules:
    patch:
      tags: [school-context]
      summary: Actualiza los modulos activos de la escuela
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active_modules]
              properties:
                active_modules:
                  type: array
                  items:
                    type: string
                    enum: [session_bookings, capacity_check, offering_plans, credit_deduction, billing_events, sport_configs, court_booking, tournament_mode]
      responses:
        '200': { description: OK }
        '400': { description: Modulos invalidos }
        '403': { description: Solo owner/admin/super_admin }
        '500': { description: Error }
  /api/v1/me/entitlements:
    get:
      tags: [me]
      summary: Plan SaaS + addons activos de la escuela actual
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '400': { description: school_id requerido }
        '500': { description: Error }
  /api/v1/me/data-export:
    get:
      tags: [me]
      summary: Exporta toda la informacion personal del usuario (Ley 1581/2012)
      security:
        - bearerAuth: []
      responses:
        '200': { description: JSON descargable }
        '400': { description: Error del RPC }
        '500': { description: export_failed }
  /api/v1/me/data-deletion-request:
    post:
      tags: [me]
      summary: Programa borrado de cuenta en 30 dias
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '202': { description: Solicitud aceptada }
        '400': { description: invalid_body }
        '500': { description: request_failed }
    delete:
      tags: [me]
      summary: Cancela la solicitud de borrado de cuenta
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200': { description: Cancelada }
        '400': { description: Error del RPC }
        '500': { description: cancel_failed }
    get:
      tags: [me]
      summary: Consulta estado de la solicitud de borrado
      security:
        - bearerAuth: []
      responses:
        '200': { description: "{ request }" }
        '500': { description: query_failed }
  /api/v1/upgrade-requests:
    post:
      tags: [upgrade-requests]
      summary: Crea una solicitud de upgrade/downgrade/addon
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_type]
              properties:
                request_type: { type: string, enum: [plan_upgrade, plan_downgrade, addon_activate, addon_deactivate, payment_update, contact_sales] }
                requested_plan_code: { type: string, enum: [starter, crecimiento, profesional, elite, enterprise] }
                requested_addon_key: { type: string, enum: [tournaments, access_control, biomech, nutrition, whitelabel, whatsapp, wompi, mp] }
                requested_billing_cycle: { type: string, enum: [monthly, annual] }
                source: { type: string, enum: [admin_app, landing, admin_panel, whatsapp, unknown] }
                source_url: { type: string }
                notes: { type: string }
      responses:
        '201': { description: OK }
        '400': { description: Faltan campos requeridos }
        '500': { description: Error }
    get:
      tags: [upgrade-requests]
      summary: Lista solicitudes de upgrade (RLS por rol)
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [pending, contacted, processed, rejected, cancelled] } }
        - { in: query, name: limit, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        '200': { description: OK }
        '500': { description: Error }
  /api/v1/upgrade-requests/{id}/process:
    post:
      tags: [upgrade-requests]
      summary: Procesa una solicitud y aplica el cambio (solo super_admin)
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string }
                amount_cents: { type: integer }
                contact_method: { type: string, default: whatsapp }
      responses:
        '200': { description: OK }
        '500': { description: Error }
  /api/v1/upgrade-requests/{id}:
    patch:
      tags: [upgrade-requests]
      summary: Marca una solicitud como contacted/rejected/cancelled
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [contacted, rejected, cancelled] }
                processed_notes: { type: string }
                contact_method: { type: string, default: whatsapp }
      responses:
        '200': { description: OK }
        '400': { description: status invalido }
        '500': { description: Error }
  /api/v1/schools/{id}/branding:
    put:
      tags: [schools]
      summary: Actualiza branding de la escuela (logo, colores, watermark)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                logo_url: { type: string, format: uri, maxLength: 1024, nullable: true }
                primary_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
                secondary_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
                show_watermark: { type: boolean }
      responses:
        '200': { description: OK }
